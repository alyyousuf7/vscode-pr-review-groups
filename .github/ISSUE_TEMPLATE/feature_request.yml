name: Feature request
description: Suggest a new feature or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point. Skip the solution for now — just the underlying need.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Idea (optional)
      description: If you have a specific implementation in mind, sketch it. Otherwise leave blank.

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing today instead?
      description: A workaround, a different extension, or manual steps.
